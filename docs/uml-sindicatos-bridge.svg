<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <title>Diagrama UML do padrão Bridge com sindicatos</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="diamond" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1,7 L7,1 L13,7 L7,13 Z" fill="white" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0f172a">
    Padrão Bridge — Comunicados de Sindicatos
  </text>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="70" y="220" width="310" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="225" y="252" text-anchor="middle" font-weight="bold" fill="#1e3a8a">&lt;&lt;abstract&gt;&gt;</text>
    <text x="225" y="278" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Sindicato</text>
    <line x1="70" y1="295" x2="380" y2="295" stroke="#2563eb"/>
    <text x="90" y="325" fill="#0f172a">- canalComunicacao: CanalComunicacao</text>
    <line x1="70" y1="340" x2="380" y2="340" stroke="#2563eb"/>
    <text x="90" y="370" fill="#0f172a">+ enviarComunicado(mensagem): String</text>
    <text x="90" y="397" fill="#0f172a">+ nome(): String</text>

    <rect x="35" y="505" width="205" height="100" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="137" y="540" text-anchor="middle" font-weight="bold" fill="#0f172a">SindicatoMetalurgicos</text>
    <text x="137" y="570" text-anchor="middle" fill="#0f172a">+ nome(): String</text>
    <rect x="255" y="505" width="205" height="100" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="357" y="540" text-anchor="middle" font-weight="bold" fill="#0f172a">SindicatoProfessores</text>
    <text x="357" y="570" text-anchor="middle" fill="#0f172a">+ nome(): String</text>

    <rect x="720" y="220" width="310" height="185" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="875" y="252" text-anchor="middle" font-weight="bold" fill="#166534">&lt;&lt;interface&gt;&gt;</text>
    <text x="875" y="278" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">CanalComunicacao</text>
    <line x1="720" y1="295" x2="1030" y2="295" stroke="#16a34a"/>
    <text x="740" y="335" fill="#0f172a">+ enviar(sindicato, mensagem): String</text>

    <rect x="650" y="505" width="205" height="100" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="752" y="540" text-anchor="middle" font-weight="bold" fill="#0f172a">EmailComunicacao</text>
    <text x="752" y="570" text-anchor="middle" fill="#0f172a">+ enviar(...): String</text>
    <rect x="875" y="505" width="205" height="100" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="977" y="540" text-anchor="middle" font-weight="bold" fill="#0f172a">WhatsAppComunicacao</text>
    <text x="977" y="570" text-anchor="middle" fill="#0f172a">+ enviar(...): String</text>
  </g>

  <path d="M137,505 L137,470 L180,430" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M357,505 L357,470 L270,430" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M752,505 L752,460 L820,405" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M977,505 L977,460 L930,405" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380,325 L720,325" fill="none" stroke="#334155" stroke-width="2" marker-start="url(#diamond)"/>
  <text x="550" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">usa / Bridge</text>
</svg>
